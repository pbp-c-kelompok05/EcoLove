<article class="ee-comment"><p><strong>{{ comment.user.username }}</strong> · {{ comment.created_at|date:'d M Y H:i' }} WIB</p><p class="ee-prose">{{ comment.body }}</p>
{% if comment.image %}<a class="ee-comment-photo-link" href="{{ comment.image.url }}" target="_blank" rel="noopener noreferrer" aria-label="Buka foto komentar {{ comment.user.username }}"><img class="ee-comment-photo" src="{{ comment.image.url }}" alt="Foto yang dilampirkan {{ comment.user.username }} pada komentar" loading="lazy" width="280" height="280"></a>{% endif %}
{% if user.is_superuser or user.pk == comment.user_id %}<form method="post" action="{% url 'events:comment_delete' comment.pk %}" data-delete>{% csrf_token %}<button class="ee-btn ee-outline" type="submit">Hapus komentar</button></form>{% endif %}</article>
