{% extends 'base.html' %}{% load static %}
{% block extra_head %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'events/vendor/grids-min.css' %}">
<link rel="stylesheet" href="{% static 'events/vendor/grids-responsive-min.css' %}">
<link rel="stylesheet" href="{% static 'events/module.css' %}">
{% endblock %}
{% block content %}
<section class="ee">
{% for notice in messages %}<p class="ee-notice {{ notice.tags }}" role="status">{{ notice }}</p>{% endfor %}
{% block module_content %}{% endblock %}
<p id="ee-feedback" role="status" aria-live="polite"></p>
</section>
{% endblock %}
{% block extra_scripts %}{{ block.super }}
<script>
(() => {
  const module = document.querySelector('.ee');
  const navbar = document.querySelector('body > .navbar');
  if (!module || !navbar) return;
  const updateOffset = () => {
    const height = getComputedStyle(navbar).position === 'fixed' ? navbar.getBoundingClientRect().height : 0;
    module.style.setProperty('--ee-header-height', `${height}px`);
  };
  updateOffset();
  new ResizeObserver(updateOffset).observe(navbar);
})();
</script>
<script src="{% static 'events/module.js' %}" defer></script>{% endblock %}
