{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="section" style="padding-top: 40px;">
  {% csrf_token %}

  <div class="section-heading" style="text-align: left; margin: 0 0 30px 0;">
    <h2 style="margin-bottom: 8px">Marketplace EcoLove</h2>
    <p>Discover secondhand and sustainable products from the EcoLove community.</p>
  </div>

  <form id="search" class="form-group" style="background-color: black;">
    <input type="search"
      id="search-input"
      placeholder="Search item..."
      class="form-group">
    <button type="submit" class="btn btn-primary">Search</button>
  </form>

  <!-- Loading State -->
  <div id="loading" class="hide" style="text-align: center; padding: 40px 0;">
    <p style="color: #666; font-size: 1.1rem;">Loading items...</p>
  </div>

  <!-- Error State -->
  <div id="error" class="hide" style="text-align: center; padding: 40px 0;">
    <p style="color: #d32f2f; font-size: 1.1rem;">Failed to load items. Please try again later.</p>
  </div>

  <!-- Empty State -->
  <div id="empty" class="hide" style="text-align: center; padding: 40px 0;">
    <p style="color: #666; font-size: 1.1rem;">No items are available right now.</p>
  </div>

  <!-- Grid Container (Elemen Utama yang Dipanggil JS Aqil) -->
  <div 
    id="grid" 
    class="card-grid hide" 
    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; width: 100%;"
    data-get-items-json="{% url 'items:get_items_json' %}"
    data-item-detail="{% url 'items:item_detail' '00000000-0000-0000-0000-000000000000' %}"
    data-like-item="{% url 'items:like_item_ajax' '00000000-0000-0000-0000-000000000000' %}"
    data-dislike-item="{% url 'items:dislike_item_ajax' '00000000-0000-0000-0000-000000000000' %}"
    data-is-authenticated="{{ user.is_authenticated }}"
    data-user-id="{{ user.id }}"
  >
  </div>
</section>

<!-- Load Script JS Marketplace milik Aqil -->
<script src="{% static 'js/marketplace.js' %}"></script>
{% endblock %}
