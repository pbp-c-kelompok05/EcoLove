{% extends 'base.html' %}

{% block content %}
<!-- MARKETPLACE -->
<section id="marketplace" class="section" style="padding-top: 80px;">
  <div class="section-heading">
    <p class="eyebrow">MARKETPLACE</p>
    <h2>Find Something to Love Again</h2>
    <p>
      Discover secondhand and sustainable products from the EcoLove community.
    </p>
  </div>

  <div class="card-grid">
    <article class="product-card">
      <div class="product-image"></div>
      <div class="card-content">
        <span class="tag">Preloved</span>
        <h3>Product Name</h3>
        <p>Rp100.000</p>
      </div>
    </article>

    <article class="product-card">
      <div class="product-image"></div>
      <div class="card-content">
        <span class="tag">Reusable</span>
        <h3>Product Name</h3>
        <p>Rp75.000</p>
      </div>
    </article>

    <article class="product-card">
      <div class="product-image"></div>
      <div class="card-content">
        <span class="tag">Upcycled</span>
        <h3>Product Name</h3>
        <p>Rp125.000</p>
      </div>
    </article>
  </div>
</section>
{% endblock %}
