{% extends 'base.html' %} 

{% block content %}
<section class="section" style="padding-top: 100px; padding-bottom: 50px; min-height: 80vh; display: flex; justify-content: center;">
  
  <div style="background: #fff; padding: 40px; border-radius: 12px; border: 1px solid #e5e7eb; width: 100%; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    
    <h2 style="margin-bottom: 8px; text-align: center;">Edit Your Item</h2>
    <p style="text-align: center; color: #666; margin-bottom: 30px;">
      Update details, change the price, or upload a new photo for "<strong>{{ item.name }}</strong>".
    </p>
    
    <!-- buat nge-upload gambar -->
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      
      <div class="form-group" style="margin-bottom: 30px; line-height: 1.6;">
        {{ form.as_p }}
      </div>
      
      <div style="display: flex; gap: 12px; justify-content: center;">
        <a href="{% url 'items:show_marketplace' %}" class="btn btn-outline" style="text-decoration: none; padding: 10px 24px;">
          Cancel
        </a>
        <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">
          Save Changes
        </button>
      </div>
    </form>

  </div>
  
</section>
{% endblock %}
