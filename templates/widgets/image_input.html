{% load static %}

{% if widget.is_initial %}
	<a id="path_id"
		 href="{{ widget.value.url }}"
		 class="hide"></a>
	{% if not widget.required %}
		<input type="checkbox"
					 name="{{ widget.checkbox_name }}"
					 id="{{ widget.checkbox_id }}"
					 class="hide"
					 {% if widget.attrs.disabled %} disabled{% endif %}
					 {% if widget.attrs.checked %} checked{% endif %}>
	{% endif %}
	<br>
{% endif %}
<input type="{{ widget.type }}"
			 oninput="addImage(event)"
			 name="{{ widget.name }}"
			 {% include "django/forms/widgets/attrs.html" %}>
<div>
	<img {% if widget.is_initial %}src="{{ widget.value.url }}"{% endif %}
			 class="product-image hide">
</div>
{% if not widget.required %}
	<button id="remove_id"
					type="button"
					class="btn btn-primary disliked hide"
					onclick="removeImage()">
		Delete Image
	</button>
	{% if widget.is_initial %}
		<button id="undo_changes_id"
						type="button"
						class="btn btn-outline hide"
						onclick="undoChanges()">
			Undo Changes
		</button>
	{% endif %}
{% endif %}

<script src="{% static 'js/widgets/image_input.js' %}"></script>
