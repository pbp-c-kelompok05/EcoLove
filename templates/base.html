{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLove — Love Me Again</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">EcoLove</a>
        <nav>
            <a href="/#home">Home</a>
            <a href="{% url 'items:show_marketplace' %}">Marketplace</a>
            <a href="/#events">Events</a>

            {% if user.is_authenticated %}
                <!-- Jika SUDAH Login -->
                <a href="/profile/" style="font-weight: 600; color: var(--primary);">
                    👤 {{ user.username }}
                </a>
                <a href="/logout/" class="btn btn-outline" style="padding: 6px 14px; font-size: 13px;">Logout</a>
            {% else %}
                <!-- Jika BELUM Login -->
                <a href="/login/" class="btn btn-primary" style="padding: 6px 16px; color: #ffffff !important;">Login</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 EcoLove. Faculty of Computer Science, University of Indonesia.</p>
    </footer>
</body>
</html>
