{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 22px;">Log In</h2>
        
        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'success' %}
                    <div style="padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9;">
                        {{ message }}
                    </div>
                {% else %}
                    <div style="padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2;">
                        {{ message }}
                    </div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="input-field" placeholder="Masukkan username" value="{{ username }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="input-field" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: 10px; padding: 12px; color: #ffffff !important;">Log In</button>
        </form>

        <p style="margin-top: 20px; text-align: center; font-size: 14px; color: var(--text-muted);">
            Belum punya akun? <a href="/register/" style="color: var(--primary); font-weight: bold;">Daftar di sini</a>
        </p>
    </div>
</div>
{% endblock %}
