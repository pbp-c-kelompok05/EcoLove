{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 22px;">Log In</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div style="padding: 10px; background-color: #ffebee; color: #c62828; border-radius: 8px; margin-bottom: 15px; font-size: 13px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="input-field" placeholder="Masukkan username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="input-field" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: 10px; padding: 12px;">Log In</button>
        </form>

        <p style="margin-top: 20px; text-align: center; font-size: 14px; color: var(--text-muted);">
            Belum punya akun? <a href="/register/" style="color: var(--primary); font-weight: bold;">Daftar di sini</a>
        </p>
    </div>
</div>
{% endblock %}
